name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # overlay 内嵌 diff 块是构建期产物：先校验产物与 core/diff.mjs 同步，再跑测试
      - run: npm run build:overlay -- --check
      - run: npm test
